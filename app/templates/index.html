<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Credits</title>
  <style>
    html { color-scheme: light; background: #fafaf9; }
    body { min-height: 100vh; margin: 0; font-family: system-ui, sans-serif; color: #1c1917; background: #fafaf9; }
    main { display: grid; gap: 1rem; max-width: 40rem; margin: 0 auto; padding: 2rem 1.25rem; }
    form { display: grid; gap: 0.75rem; }
    label { display: grid; gap: 0.25rem; }
    input, button { font: inherit; padding: 0.5rem 0.6rem; }
    input { background: #fff; color: #1c1917; border: 1px solid #d6d3d1; }
    button { background: #1c1917; color: #fff; border: 0; cursor: pointer; }
    .field-error { color: #b91c1c; margin: 0; }
    .field-error:empty { display: none; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 0.4rem 0; border-bottom: 1px solid #e7e5e4; }
    td:last-child, th:last-child { text-align: right; }
    .note, #status { color: #57534e; }
  </style>
</head>
<body>
  <main>
    <h1>Credits</h1>
    <p class="note">No sign-in. Type a user id and an amount. The balance changes after the worker finishes.</p>
    <form id="credit-form">
      <label>User id
        <input id="user-id" name="user_id" required maxlength="128" pattern="[A-Za-z0-9_-]+" autocomplete="off">
        <p id="user-error" class="field-error" role="alert"></p>
      </label>
      <label>Amount
        <input id="amount" name="amount" required inputmode="decimal" placeholder="25.00" autocomplete="off">
        <p id="amount-error" class="field-error" role="alert"></p>
      </label>
      <button type="submit">Add credit</button>
    </form>
    <p id="status" role="status"></p>
    <h2>Balances</h2>
    <p id="empty">No balances yet.</p>
    <table>
      <thead>
        <tr><th>User</th><th>Balance</th></tr>
      </thead>
      <tbody id="balances"></tbody>
    </table>
  </main>
  <script>
    const form = document.getElementById("credit-form");
    const statusLine = document.getElementById("status");
    const empty = document.getElementById("empty");
    const balances = document.getElementById("balances");
    const submitButton = form.querySelector("button");
    const amountInput = document.getElementById("amount");
    const userError = document.getElementById("user-error");
    const amountError = document.getElementById("amount-error");
    let submitting = false;

    function setStatus(message) {
      statusLine.textContent = message;
    }

    function setFieldError(element, message) {
      element.textContent = message || "";
    }

    function clearFieldErrors() {
      setFieldError(userError, "");
      setFieldError(amountError, "");
    }

    function sanitizeAmount(raw) {
      let value = String(raw).replace(/-/g, "").replace(/[^\d.]/g, "");
      const dot = value.indexOf(".");
      if (dot === -1) return value;
      const whole = value.slice(0, dot);
      const fraction = value.slice(dot + 1).replace(/\./g, "").slice(0, 2);
      return whole + "." + fraction;
    }

    function errorMessage(payload) {
      if (payload && typeof payload.detail === "string") return payload.detail;
      if (payload && Array.isArray(payload.detail) && payload.detail[0] && payload.detail[0].msg) {
        return payload.detail[0].msg;
      }
      return "Request failed.";
    }

    function showRequestError(payload) {
      setStatus("");
      if (payload && Array.isArray(payload.detail)) {
        let placed = false;
        payload.detail.forEach((item) => {
          const field = Array.isArray(item.loc) ? item.loc[item.loc.length - 1] : "";
          if (field === "user_id") {
            setFieldError(userError, item.msg);
            placed = true;
          } else if (field === "amount") {
            setFieldError(amountError, item.msg);
            placed = true;
          }
        });
        if (placed) return;
      }
      setFieldError(amountError, errorMessage(payload));
    }

    function renderUsers(users) {
      balances.replaceChildren();
      empty.hidden = users.length > 0;
      users.forEach((user) => {
        const row = document.createElement("tr");
        const idCell = document.createElement("td");
        const balanceCell = document.createElement("td");
        idCell.textContent = user.user_id;
        balanceCell.textContent = user.balance;
        row.append(idCell, balanceCell);
        balances.append(row);
      });
    }

    async function loadUsers() {
      const response = await fetch("/users");
      if (!response.ok) {
        setFieldError(amountError, "Could not load balances.");
        return;
      }
      const payload = await response.json();
      renderUsers(payload.users || []);
    }

    async function pollCredit(taskId) {
      const deadline = Date.now() + 30000;
      while (Date.now() < deadline) {
        const response = await fetch("/credits/" + encodeURIComponent(taskId));
        if (!response.ok) {
          setStatus("");
          setFieldError(amountError, "Could not read credit status.");
          return;
        }
        const credit = await response.json();
        if (credit.status === "processed") {
          setStatus("Processed " + credit.amount + " for " + credit.user_id + ".");
          await loadUsers();
          return;
        }
        if (credit.status === "failed") {
          setStatus("");
          setFieldError(amountError, credit.error || "Credit failed.");
          return;
        }
        setStatus("Processing. The balance updates when the worker finishes.");
        await new Promise((resolve) => setTimeout(resolve, 1000));
      }
      setStatus("Still processing. The balance will update after the worker finishes.");
    }

    amountInput.addEventListener("input", () => {
      const cleaned = sanitizeAmount(amountInput.value);
      if (cleaned !== amountInput.value) amountInput.value = cleaned;
      setFieldError(amountError, "");
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (submitting) return;
      clearFieldErrors();
      const body = {
        user_id: new FormData(form).get("user_id"),
        amount: sanitizeAmount(new FormData(form).get("amount")).replace(/\.$/, ""),
      };
      amountInput.value = body.amount;
      if (!(Number(body.amount) > 0)) {
        setFieldError(amountError, "Amount must be greater than 0.");
        return;
      }
      submitting = true;
      submitButton.disabled = true;
      try {
        const response = await fetch("/credits", {
          method: "POST",
          headers: {
            "content-type": "application/json",
            "Idempotency-Key": crypto.randomUUID(),
          },
          body: JSON.stringify(body),
        });
        const payload = await response.json();
        if (!response.ok) {
          showRequestError(payload);
          return;
        }
        setStatus("Accepted. Waiting for the worker.");
        await pollCredit(payload.task_id);
      } catch (error) {
        setStatus("");
        setFieldError(amountError, "Could not reach the credit API.");
      } finally {
        submitting = false;
        submitButton.disabled = false;
      }
    });

    loadUsers().catch(() => setFieldError(amountError, "Could not load balances."));
  </script>
</body>
</html>
