[project]
name = "basta-credits"
version = "0.1.0"
description = "Asynchronous credit processing service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "celery[redis]>=5.4",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "pymongo>=4.9",
    "redis>=5.2",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
